<div class="phase-box">
    
    <div class="container">
        <h1>Focused Study Time</h1>
        <p>
          <div class="user-goal"> 
          <img src="imgs/Icons/goal.svg"
                   width= "4%"
                   height="auto"/> <h4>Learning Goal</h4>
                   <p><textarea variable="userGoalArea" id="userGoal"></textarea></p>
                   <div id="printGoal" class="printFormatting"></div> </div></p>

        <div class="timer-settings">
          <div class="setting">
            <label for="work-time">Focus Time (min):</label>
            <input type="number" id="work-time" min="1" max="60" value="25" />
          </div>
          
        </div>
        <div class="timer">
          <div class="timer-display">
            <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
          </div>
          <div class="blurb-button timer-buttons" id="timer-clicks">
            <button id="timer-start" class="button">Start</button>
            <button id="timer-pause" class="button button-secondary" hidden> Pause </button>
            <button id="timer-resume" class="button button-secondary" hidden> Resume </button>
            <button id="timer-restart" class="button button-secondary" hidden> Restart </button>
          </div>
        </div>
    </div>
   
    
    <p> <div class="phase-link"><a href="#phase5" id="toPhase5">I have completed my study time</a></div></p> </p>
</div>

   



</div>
